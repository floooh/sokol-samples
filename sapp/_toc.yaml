# LLM maintained
#
# Metadata for the sokol_app samples in this directory.
# Used to build the samples webpage.
#
# assets: data files to copy into the webpage directory.
#
# samples: one entry per sample, in webpage order.
#   name:        sample name
#   description: one short sentence
#   tags:        search keywords, 'compute' means the sample needs compute support
#   source:      sample source file
#   shader:      shader source file (only when the sample has a .glsl file)
#   ui:          true when a [name]-sapp-ui variant with debug UI exists
#   webgl:       true when the sample runs on WebGL2
#   webgpu:      true when the sample runs on WebGPU

